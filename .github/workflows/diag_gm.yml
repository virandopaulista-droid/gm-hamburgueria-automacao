name: Diagnostico GM video (temp)

on:
  workflow_dispatch:

env:
  RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash
      - name: Configure rclone and mount
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_SECRET" > ~/.config/rclone/rclone.conf
          mkdir -p "$HOME/gdrive"
          rclone mount gdrive: "$HOME/gdrive" --daemon --vfs-cache-mode=minimal --dir-cache-time=1h --timeout=60s --contimeout=60s --low-level-retries=15 --log-file="$HOME/rclone-mount.log" --log-level=INFO
          sleep 3
          rclone lsf gdrive: -R --dirs-only > "$HOME/all_dirs.txt"
          rel_path=$(grep -i "^Ag.ncia BEEF MTK/Clientes */GM - Hamburgueria */$" "$HOME/all_dirs.txt" | head -1)
          gm_dir="$HOME/gdrive/${rel_path}"
          for i in $(seq 1 15); do [ -d "$gm_dir" ] && break; sleep 2; done
          gm_dir="${gm_dir%/}"
          echo "GM_DIR=$gm_dir" >> "$GITHUB_ENV"
      - name: Investiga pasta de videos
        run: |
          echo "=== ls GM_DIR (raiz) ==="
          ls -la "$GM_DIR"
          echo ""
          videos_name=$(ls "$GM_DIR" | grep -i "^V.deos Tratados *$" | head -1)
          echo "videos_name resolvido: [$videos_name]"
          echo ""
          echo "=== ls dentro de 'Vídeos Tratados' ==="
          ls -la "$GM_DIR/$videos_name"
          echo ""
          echo "=== ls dentro de '.../2026' (se existir) ==="
          ls -la "$GM_DIR/$videos_name/2026" 2>&1 || echo "PASTA '2026' NAO EXISTE nesse nivel"
          echo ""
          echo "=== busca recursiva pelo arquivo em toda a pasta de videos (case-insensitive) ==="
          find "$GM_DIR/$videos_name" -iname "*Edit geral dos lanches*" 2>&1
